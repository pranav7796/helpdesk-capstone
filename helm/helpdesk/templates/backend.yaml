apiVersion: v1
kind: Service
metadata:
  name: relaydesk-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: relaydesk-backend
    {{- include "relaydesk.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: relaydesk-backend }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector: { app: relaydesk-backend }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relaydesk-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: relaydesk-backend
    {{- include "relaydesk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: relaydesk-backend }
  template:
    metadata:
      labels:
        app: relaydesk-backend
        {{- include "relaydesk.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        - name: database-migrations
          image: {{ .Values.images.backend | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [alembic, upgrade, head]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "relaydesk.name" . }}-database, key: DATABASE_URL } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 192Mi }
      containers:
        - name: backend
          image: {{ .Values.images.backend | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "relaydesk.name" . }}-database, key: DATABASE_URL } }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources.backend | indent 12 }}
