apiVersion: v1
kind: Service
metadata:
  name: relaydesk-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: relaydesk-frontend
    {{- include "relaydesk.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: relaydesk-frontend }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relaydesk-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: relaydesk-frontend
    {{- include "relaydesk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: relaydesk-frontend }
  template:
    metadata:
      labels:
        app: relaydesk-frontend
        {{- include "relaydesk.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: frontend
          image: {{ .Values.images.frontend | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5 }
          resources:
{{ toYaml .Values.resources.frontend | indent 12 }}
