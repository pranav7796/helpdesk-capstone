apiVersion: v1
kind: Secret
metadata:
  name: {{ include "relaydesk.name" . }}-database
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://{{ .Values.database.user }}:{{ .Values.database.password }}@relaydesk-postgres:5432/{{ .Values.database.name }}
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: relaydesk-postgres
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector: { app: relaydesk-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: relaydesk-postgres-data
  namespace: {{ .Values.namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: {{ .Values.database.storage }} }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: relaydesk-postgres
  namespace: {{ .Values.namespace }}
spec:
  serviceName: relaydesk-postgres
  replicas: 1
  selector:
    matchLabels: { app: relaydesk-postgres }
  template:
    metadata:
      labels: { app: relaydesk-postgres }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.images.postgres | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{ name: postgres, containerPort: 5432 }]
          envFrom:
            - secretRef: { name: {{ include "relaydesk.name" . }}-database }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources.postgres | indent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: relaydesk-postgres-data }
