{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: relaydesk-backend
  namespace: {{ .Values.namespace }}
  labels:
    release: {{ .Values.monitoring.serviceMonitor.releaseLabel }}
spec:
  selector:
    matchLabels: { app: relaydesk-backend }
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
