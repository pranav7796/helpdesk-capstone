nameOverride: relaydesk
namespace: relaydesk
replicaCount: 2
images:
  backend: relaydesk-backend:local
  frontend: relaydesk-frontend:local
  postgres: postgres:17-alpine
imagePullPolicy: IfNotPresent
database:
  name: relaydesk
  user: relaydesk
  password: relaydesk-local-only
  storage: 2Gi
backend:
  port: 8000
frontend:
  port: 8080
resources:
  backend:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 700m, memory: 384Mi }
  frontend:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 300m, memory: 128Mi }
  postgres:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  cpuTarget: 70
ingress:
  enabled: true
  className: nginx
  host: ""
monitoring:
  serviceMonitor:
    enabled: true
    releaseLabel: kube-prometheus-stack
