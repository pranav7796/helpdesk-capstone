---
# Source: relaydesk/templates/postgres.yaml
apiVersion: v1
kind: Secret
metadata:
  name: relaydesk-database
  namespace: relaydesk
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://relaydesk:relaydesk-local-only@relaydesk-postgres:5432/relaydesk
  POSTGRES_DB: "relaydesk"
  POSTGRES_USER: "relaydesk"
  POSTGRES_PASSWORD: "relaydesk-local-only"
---
# Source: relaydesk/templates/postgres.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: relaydesk-postgres-data
  namespace: relaydesk
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 2Gi }
---
# Source: relaydesk/templates/backend.yaml
apiVersion: v1
kind: Service
metadata:
  name: relaydesk-backend
  namespace: relaydesk
  labels:
    app: relaydesk-backend
    app.kubernetes.io/name: relaydesk
    app.kubernetes.io/instance: relaydesk
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: relaydesk-1.0.0
spec:
  type: ClusterIP
  selector: { app: relaydesk-backend }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
# Source: relaydesk/templates/backend.yaml
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: relaydesk
spec:
  type: ClusterIP
  selector: { app: relaydesk-backend }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
# Source: relaydesk/templates/frontend.yaml
apiVersion: v1
kind: Service
metadata:
  name: relaydesk-frontend
  namespace: relaydesk
  labels:
    app: relaydesk-frontend
    app.kubernetes.io/name: relaydesk
    app.kubernetes.io/instance: relaydesk
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: relaydesk-1.0.0
spec:
  type: ClusterIP
  selector: { app: relaydesk-frontend }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
# Source: relaydesk/templates/postgres.yaml
apiVersion: v1
kind: Service
metadata:
  name: relaydesk-postgres
  namespace: relaydesk
spec:
  type: ClusterIP
  selector: { app: relaydesk-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
---
# Source: relaydesk/templates/backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relaydesk-backend
  namespace: relaydesk
  labels:
    app: relaydesk-backend
    app.kubernetes.io/name: relaydesk
    app.kubernetes.io/instance: relaydesk
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: relaydesk-1.0.0
spec:
  replicas: 2
  selector:
    matchLabels: { app: relaydesk-backend }
  template:
    metadata:
      labels:
        app: relaydesk-backend
        app.kubernetes.io/name: relaydesk
        app.kubernetes.io/instance: relaydesk
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: relaydesk-1.0.0
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        - name: database-migrations
          image: "relaydesk-backend:local"
          imagePullPolicy: Never
          command: [alembic, upgrade, head]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: relaydesk-database, key: DATABASE_URL } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 192Mi }
      containers:
        - name: backend
          image: "relaydesk-backend:local"
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: relaydesk-database, key: DATABASE_URL } }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: 700m
              memory: 384Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
# Source: relaydesk/templates/frontend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relaydesk-frontend
  namespace: relaydesk
  labels:
    app: relaydesk-frontend
    app.kubernetes.io/name: relaydesk
    app.kubernetes.io/instance: relaydesk
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: relaydesk-1.0.0
spec:
  replicas: 2
  selector:
    matchLabels: { app: relaydesk-frontend }
  template:
    metadata:
      labels:
        app: relaydesk-frontend
        app.kubernetes.io/name: relaydesk
        app.kubernetes.io/instance: relaydesk
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: relaydesk-1.0.0
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: frontend
          image: "relaydesk-frontend:local"
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5 }
          resources:
            limits:
              cpu: 300m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 32Mi
---
# Source: relaydesk/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: relaydesk-backend
  namespace: relaydesk
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: relaydesk-backend }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
# Source: relaydesk/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: relaydesk-postgres
  namespace: relaydesk
spec:
  serviceName: relaydesk-postgres
  replicas: 1
  selector:
    matchLabels: { app: relaydesk-postgres }
  template:
    metadata:
      labels: { app: relaydesk-postgres }
    spec:
      containers:
        - name: postgres
          image: "postgres:17-alpine"
          imagePullPolicy: Never
          ports: [{ name: postgres, containerPort: 5432 }]
          envFrom:
            - secretRef: { name: relaydesk-database }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: relaydesk-postgres-data }
