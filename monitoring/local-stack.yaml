apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: relaydesk
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: relaydesk-backend
        metrics_path: /metrics
        static_configs:
          - targets: [relaydesk-backend.relaydesk.svc.cluster.local:8000]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: relaydesk
  labels: { app: prometheus }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus]
          ports: [{ name: web, containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /-/ready, port: web }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /-/healthy, port: web }, initialDelaySeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 700m, memory: 768Mi }
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }]
      volumes: [{ name: config, configMap: { name: prometheus-config } }]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: relaydesk
spec:
  type: ClusterIP
  selector: { app: prometheus }
  ports: [{ name: web, port: 9090, targetPort: web }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: relaydesk
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: relaydesk
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Relaydesk
        orgId: 1
        folder: Relaydesk
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: relaydesk
  labels: { app: grafana }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: relaydesk-demo-only }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
          ports: [{ name: web, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /api/health, port: web }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: web }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 700m, memory: 768Mi }
          volumeMounts:
            - { name: datasource, mountPath: /etc/grafana/provisioning/datasources }
            - { name: provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboard, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - { name: datasource, configMap: { name: grafana-datasource } }
        - { name: provider, configMap: { name: grafana-dashboard-provider } }
        - { name: dashboard, configMap: { name: grafana-dashboard } }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: relaydesk
spec:
  type: ClusterIP
  selector: { app: grafana }
  ports: [{ name: web, port: 3000, targetPort: web }]
